openapi: 3.0.3
info:
  title: Visa Assignment API
  version: 1.0.0
  description: API for managing members, reward points, and reward activity.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
  /v1/members:
    post:
      summary: Create a member
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      summary: Get a member and their points balance
      operationId: getMember
      responses:
        "200":
          description: Member and current points balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/members/{memberId}/rewards:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      summary: List a member's reward transactions
      operationId: getMemberRewards
      responses:
        "200":
          description: Reward transactions for the member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reward"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/rewards:
    post:
      summary: Create a reward transaction
      description: Point type IDs 1-3 add points; point type ID 4 redeems points.
      operationId: createReward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardRequest"
      responses:
        "201":
          description: Reward transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Insufficient points balance for redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: Positive member ID
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    MemberRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Alex Morgan
        email:
          type: string
          format: email
          example: alex@example.com
    Member:
      type: object
      properties:
        member_id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    MemberBalance:
      allOf:
        - $ref: "#/components/schemas/Member"
        - type: object
          properties:
            points_balance:
              type: integer
              format: int64
    RewardRequest:
      type: object
      required: [member_id, point_type_id, points, description]
      properties:
        member_id:
          type: integer
          format: int64
          minimum: 1
        point_type_id:
          type: integer
          minimum: 1
          maximum: 4
          description: "1-3 add points; 4 redeems points."
        points:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
          minLength: 1
    Reward:
      type: object
      properties:
        reward_id:
          type: integer
          format: int64
        member_id:
          type: integer
          format: int64
        point_type_id:
          type: integer
        points:
          type: integer
          format: int64
          description: Negative for redemption transactions.
        description:
          type: string
        event_date:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request payload or parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Member not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with existing data or an active transaction
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
